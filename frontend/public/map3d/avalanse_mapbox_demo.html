<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Avalanche 3D - Mapbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.9);
      padding: 10px 15px;
      border-radius: 4px;
      font-family: sans-serif;
      font-size: 14px;
      max-width: 300px;
      z-index: 1;
    }
    #info h3 { margin: 0 0 8px 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // Replace with your Mapbox access token
    mapboxgl.accessToken = 'pk.eyJ1IjoidGhlbm9penoiLCJhIjoiY2lyZXViYjlrMDAxaGlobTRyZ2p3dm45diJ9.JTY15oBLO0T9XGAT890Ahg';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/thenoizz/clmlpc3ls01wg01r70etz71g1',
      center: [24.6110, 45.6004],
      zoom: 15,
      pitch: 60,
      bearing: -20,
      antialias: true
    });

    map.addControl(new mapboxgl.NavigationControl());

    map.on('load', () => {
      // Add terrain only if not already present in style
      if (!map.getSource('mapbox-dem')) {
        map.addSource('mapbox-dem', {
          type: 'raster-dem',
          url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
          tileSize: 512,
          maxzoom: 14
        });
        map.setTerrain({ source: 'mapbox-dem', exaggeration: 1.2 });
      }

      // Add avalanche GeoJSON source
      map.addSource('avalanche', {
        type: 'geojson',
        data: 'geojson/avalanse_balea_2025.geojson'
      });

      // Avalanche path - flat polygon on terrain
      map.addLayer({
        id: 'avalanche-path',
        type: 'fill',
        source: 'avalanche',
        filter: ['==', ['get', 'type'], 'path'],
        paint: {
          'fill-color': '#ff0000',
          'fill-opacity': 0.6
        }
      });

      // Avalanche path outline
      map.addLayer({
        id: 'avalanche-path-outline',
        type: 'line',
        source: 'avalanche',
        filter: ['==', ['get', 'type'], 'path'],
        paint: {
          'line-color': '#ffff00',
          'line-width': 3
        }
      });

      // Crown wall - 3D extrusion (scaled up for visibility)
      map.addLayer({
        id: 'crown-wall-3d',
        type: 'fill-extrusion',
        source: 'avalanche',
        filter: ['==', ['get', 'type'], 'crown'],
        paint: {
          'fill-extrusion-color': '#ff0000',
          'fill-extrusion-height': 5,
          'fill-extrusion-base': 0,
          'fill-extrusion-opacity': 0.9
        }
      });

      // Debris mound - 3D extrusion (scaled up for visibility)
      map.addLayer({
        id: 'debris-mound-3d',
        type: 'fill-extrusion',
        source: 'avalanche',
        filter: ['==', ['get', 'type'], 'debris'],
        paint: {
          'fill-extrusion-color': '#ffaa00',
          'fill-extrusion-height': 8,
          'fill-extrusion-base': 0,
          'fill-extrusion-opacity': 0.9
        }
      });

      // Trigger point marker
      map.addLayer({
        id: 'trigger-point',
        type: 'circle',
        source: 'avalanche',
        filter: ['all',
          ['==', ['get', 'type'], 'point'],
          ['==', ['get', 'point_type'], 'trigger']
        ],
        paint: {
          'circle-radius': 10,
          'circle-color': '#ff0000',
          'circle-stroke-width': 3,
          'circle-stroke-color': '#ffffff'
        }
      });

      // Accumulation point marker
      map.addLayer({
        id: 'accumulation-point',
        type: 'circle',
        source: 'avalanche',
        filter: ['all',
          ['==', ['get', 'type'], 'point'],
          ['==', ['get', 'point_type'], 'accumulation']
        ],
        paint: {
          'circle-radius': 10,
          'circle-color': '#ffaa00',
          'circle-stroke-width': 3,
          'circle-stroke-color': '#ffffff'
        }
      });

      // Click handler for popup
      map.on('click', 'avalanche-path', (e) => {
        const props = e.features[0].properties;
        new mapboxgl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(`
            <strong>${props.incident}</strong><br>
            Date: ${props.date}<br>
            Type: ${props.avalanche_type}<br>
            Size: ${props.size}<br>
            Track: ${props.track_length_m}m<br>
            <a href="${props.link}" target="_blank">View Report</a>
          `)
          .addTo(map);
      });

      map.on('mouseenter', 'avalanche-path', () => {
        map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'avalanche-path', () => {
        map.getCanvas().style.cursor = '';
      });
    });
  </script>
</body>
</html>
