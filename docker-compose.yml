services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: aic_user
      RABBITMQ_DEFAULT_PASS: aic_pass

  backend:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://188.24.31.84:22050/aic_avalanse?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: changeme
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: aic_user
      SPRING_RABBITMQ_PASSWORD: aic_pass
      GEMINI_API_KEY: ${GEMINI_API_KEY:-YOUR_NEW_API_KEY_HERE}
    ports:
      - "8080:8080"
    depends_on:
      - rabbitmq
    volumes:
      - ./uploads:/app/uploads

  notification-service:
    build: ./notification-service
    ports:
      - "8082:8082"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: aic_user
      SPRING_RABBITMQ_PASSWORD: aic_pass
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-your_email@gmail.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-YOUR_EMAIL_APP_PASSWORD_HERE}

    depends_on:
      - rabbitmq

  frontend:
    build: ./frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
      NOTIFICATION_SERVICE_HOST: notification-service
      NOTIFICATION_SERVICE_PORT: 8082
    ports:
      - "443:443"
      - "8081:80"
    depends_on:
      - backend
      - notification-service

  vision-service:
    build: ./vision-service
    ports:
      - "8000:8000"