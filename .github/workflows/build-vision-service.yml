name: Build and Deploy Vision Service

on:
  push:
    branches: [ "master" ]
    paths:
      - 'vision-service/**'
      - '.github/workflows/build-vision-service.yml'
  pull_request:
    paths:
      - 'vision-service/**'
      - '.github/workflows/build-vision-service.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/aic-vision-service

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./vision-service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Redeploy app on TrueNAS
        run: |
          curl -sSf -k -X POST \
            "${{ secrets.TRUENAS_URL }}/api/v2.0/app/redeploy" \
            -H "Authorization: Bearer ${{ secrets.TRUENAS_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '"aic-vision"'
